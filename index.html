<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Scientex Berhad - Digital Business Card"
    >

    <meta
        name="theme-color"
        content="#07162B"
    >

    <title>Scientex | Digital Business Card</title>


    <style>

        /* =========================================================
           GLOBAL
        ========================================================= */

        * {
            box-sizing: border-box;
        }

        html {
            margin: 0;
            padding: 0;
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            padding: 0;

            min-height: 100vh;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Helvetica,
                Arial,
                sans-serif;

            color: #ffffff;

            background:
                radial-gradient(
                    circle at 15% 10%,
                    rgba(40, 100, 190, 0.25),
                    transparent 35%
                ),

                radial-gradient(
                    circle at 90% 85%,
                    rgba(25, 70, 145, 0.20),
                    transparent 35%
                ),

                linear-gradient(
                    135deg,
                    #061426 0%,
                    #0A2342 50%,
                    #07182F 100%
                );
        }


        /* =========================================================
           PAGE CONTAINER
        ========================================================= */

        .page {
            width: 100%;
            min-height: 100vh;

            padding:
                45px 20px
                55px;
        }

        .container {
            width: 100%;
            max-width: 1050px;

            margin: 0 auto;
        }


        /* =========================================================
           HEADER
        ========================================================= */

        .header {
            text-align: center;

            margin-bottom: 42px;
        }

        .brand {
            margin: 0;

            font-size: 36px;
            font-weight: 700;

            letter-spacing: 5px;

            color: #ffffff;
        }

        .brand-line {
            width: 55px;
            height: 3px;

            margin:
                15px auto
                16px;

            border-radius: 10px;

            background: #ffffff;
        }

        .subtitle {
            margin: 0;

            font-size: 13px;
            font-weight: 400;

            letter-spacing: 2.5px;

            text-transform: uppercase;

            color:
                rgba(255, 255, 255, 0.68);
        }


        /* =========================================================
           CARD SECTION
        ========================================================= */

        .card-section {
            width: 100%;

            margin-bottom: 45px;
        }


        /* =========================================================
           BUSINESS CARD FRAME
        ========================================================= */

        .business-card {
            position: relative;

            width: 100%;

            padding: 8px;

            background: #ffffff;

            border-radius: 16px;

            box-shadow:
                0 25px 60px rgba(0, 0, 0, 0.40),
                0 8px 20px rgba(0, 0, 0, 0.18);

            overflow: hidden;
        }


        /* Elegant outer border */

        .business-card::after {
            content: "";

            position: absolute;

            inset: 0;

            border-radius: 16px;

            border: 1px solid
                rgba(255, 255, 255, 0.75);

            pointer-events: none;
        }


        /* =========================================================
           CARD IMAGE
        ========================================================= */

        .business-card img {
            display: block;

            width: 100%;

            height: auto;

            max-width: 100%;

            border-radius: 9px;
        }


        /* =========================================================
           FRONT / BACK DIVIDER
        ========================================================= */

        .divider {
            display: flex;

            align-items: center;

            justify-content: center;

            gap: 18px;

            margin:
                32px auto
                36px;

            max-width: 700px;
        }

        .divider-line {
            flex: 1;

            height: 1px;

            background:
                rgba(255, 255, 255, 0.18);
        }

        .divider-dot {
            width: 7px;
            height: 7px;

            border-radius: 50%;

            background: #D4A72C;

            box-shadow:
                0 0 10px
                rgba(212, 167, 44, 0.35);
        }


        /* =========================================================
           FOOTER
        ========================================================= */

        .footer {
            margin-top: 48px;

            text-align: center;
        }

        .footer-company {
            margin: 0;

            font-size: 12px;
            font-weight: 600;

            letter-spacing: 2px;

            text-transform: uppercase;

            color:
                rgba(255, 255, 255, 0.72);
        }

        .footer-location {
            margin-top: 8px;

            font-size: 11px;

            color:
                rgba(255, 255, 255, 0.42);
        }


        /* =========================================================
           MOBILE
        ========================================================= */

        @media (max-width: 700px) {

            .page {
                padding:
                    28px 10px
                    40px;
            }

            .container {
                max-width: 100%;
            }

            .header {
                margin-bottom: 28px;
            }

            .brand {
                font-size: 25px;

                letter-spacing: 4px;
            }

            .brand-line {
                width: 45px;

                height: 2px;

                margin:
                    12px auto
                    13px;
            }

            .subtitle {
                font-size: 10px;

                letter-spacing: 2px;
            }

            .card-section {
                margin-bottom: 30px;
            }

            .business-card {
                padding: 5px;

                border-radius: 10px;

                box-shadow:
                    0 12px 30px
                    rgba(0, 0, 0, 0.30);
            }

            .business-card::after {
                border-radius: 10px;
            }

            .business-card img {
                border-radius: 6px;
            }

            .divider {
                gap: 12px;

                margin:
                    22px auto
                    26px;
            }

            .divider-dot {
                width: 6px;
                height: 6px;
            }

            .footer {
                margin-top: 35px;
            }

            .footer-company {
                font-size: 10px;
            }

            .footer-location {
                font-size: 9px;
            }
        }


        /* =========================================================
           SMALL PHONES
        ========================================================= */

        @media (max-width: 380px) {

            .page {
                padding-left: 7px;
                padding-right: 7px;
            }

            .brand {
                font-size: 22px;
            }

            .subtitle {
                font-size: 9px;
            }

        }

    </style>

</head>


<body>


    <main class="page">

        <div class="container">


            <!-- =================================================
                 HEADER
            ================================================== -->

            <header class="header">

                <h1 class="brand">
                    SCIENTEX
                </h1>

                <div class="brand-line"></div>

                <p class="subtitle">
                    Digital Business Card
                </p>

            </header>



            <!-- =================================================
                 FRONT OF CARD
            ================================================== -->

            <section class="card-section">

                <div class="business-card">

                    <img
                        src="business-card.jpg?v=3"
                        alt="Scientex Business Card - Front"
                    >

                </div>

            </section>



            <!-- =================================================
                 ELEGANT DIVIDER
            ================================================== -->

            <div class="divider">

                <div class="divider-line"></div>

                <div class="divider-dot"></div>

                <div class="divider-line"></div>

            </div>



            <!-- =================================================
                 BACK OF CARD
            ================================================== -->

            <section class="card-section">

                <div class="business-card">

                    <img
                        src="business-card-back.jpg?v=3"
                        alt="Scientex Business Card - Back"
                    >

                </div>

            </section>



            <!-- =================================================
                 FOOTER
            ================================================== -->

            <footer class="footer">

                <p class="footer-company">
                    Scientex Berhad
                </p>

                <p class="footer-location">
                    Manufacturing Division · Shah Alam, Selangor
                </p>

            </footer>


        </div>

    </main>


</body>

</html>
